[package]
name = "viblenow"
version = "1.0.0"
description = "VibleNow desktop app: the Vible reader bundled for macOS and Windows"
edition = "2021"

[lib]
name = "viblenow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-dialog = "=2.8.0"
tauri-plugin-fs = "=2.6.0"
tauri-plugin-opener = "=2.6.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
